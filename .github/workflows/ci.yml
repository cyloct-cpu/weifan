name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  extension:
    name: 扩展内核测试与打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 内核断言集（33 项）
        working-directory: extension
        run: node tests/selftest.mjs

      - name: 语法检查
        working-directory: extension
        run: |
          node --check src/background.js
          node --check src/content/whatsapp.js
          node --check src/options/options.js
          node --check src/shared/ext.js
          node --check src/core/core.js
          node --check src/core/language.js
          node --check src/core/glossary.js
          node --check src/core/routing.js
          node --check src/core/providers.js

      - name: 多浏览器打包
        working-directory: extension
        run: node scripts/build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: weifan-extension
          path: extension/dist
          retention-days: 14
