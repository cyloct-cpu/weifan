name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  android:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK 组件
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 构建 debug APK（debug 签名，可直接安装）
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 重命名为带版本+架构的名字
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for f in android/app/build/outputs/apk/debug/app-*-debug.apk; do
            ABI=$(basename "$f" | sed -E 's/^app-(.*)-debug\.apk$/\1/')
            cp "$f" "weifan-android-${VERSION}-${ABI}.apk"
          done
          ls -lh weifan-android-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: weifan-android-*.apk

  extension:
    name: 打包扩展
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 断言集与语法检查
        working-directory: extension
        run: |
          node tests/selftest.mjs
          node --check src/background.js
          node --check src/content/whatsapp.js
          node --check src/options/options.js

      - name: 生成三份产物
        working-directory: extension
        run: node scripts/build.mjs

      - name: 压缩
        working-directory: extension/dist
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -qr "weifan-chrome-${VERSION}.zip" chrome
          zip -qr "weifan-firefox-${VERSION}.zip" firefox
          ls -lh *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: extension/dist/*.zip

  publish:
    name: 发布
    needs: [android, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理文件
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.apk' -o -name '*.zip' \) -exec cp {} out/ \;
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: WeFlip ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            ## 安装

            **Android**：按设备架构下载对应包（debug 签名，仅供自用）：
            绝大多数 2019 年后的安卓手机选 **arm64-v8a**；老旧低端机选 armeabi-v7a；模拟器/部分平板选 x86_64。
            装完打开 WeFlip → 设置里填翻译密钥 → 「关联设备」生成配对码，手机 WhatsApp 扫码完成登录。
            国产 ROM 记得做保活（见 `android/README.md`），否则息屏后连接会被杀。

            **Chrome / Edge / Brave / Opera**：下载 `weifan-chrome-*.zip` 解压，
            打开 `chrome://extensions` → 开发者模式 → 加载已解压的扩展程序 → 选解压出来的 `chrome` 目录。

            **Firefox**：下载 `weifan-firefox-*.zip` 解压，
            `about:debugging#/runtime/this-firefox` → 临时载入附加组件 → 选 `firefox/manifest.json`。

            > Safari 版本未包含：需要 Xcode 用 `safari-web-extension-converter` 包一层 App，见 `extension/README.md`。
          files: |
            out/*.apk
            out/*.zip
