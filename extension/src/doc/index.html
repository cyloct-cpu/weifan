<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>微翻 · 文档翻译</title>
  <link rel="icon" href="../icons/favicon-32.png" type="image/png" />
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="doc.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <strong class="wordmark">微翻 · 文档翻译</strong>
    <span class="hint-left">文件只在本机解析，不上传</span>
  </div>
</header>

<main class="page">
  <section class="bar">
    <div class="group">
      <label class="lbl" for="targetLang">目标语言</label>
      <select id="targetLang"></select>
    </div>
    <div class="group">
      <label class="lbl" for="service">服务</label>
      <select id="service"></select>
    </div>
    <div class="group">
      <label class="lbl" for="style">语气</label>
      <select id="style">
        <option value="business">商务</option>
        <option value="casual">日常</option>
        <option value="literal">直译</option>
      </select>
    </div>
  </section>

  <section class="drop" id="drop">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 7 8h3v6H6l6 6 6-6h-4V8h3l-5-5Z"/></svg>
    <p class="drop-title">把文件拖进来，或点下面选</p>
    <p class="drop-hint">支持 txt / md / csv / pdf / docx　·　PDF 与 Word 只抽文字，版式不保留</p>
    <input type="file" id="file" accept=".txt,.md,.csv,.pdf,.docx,text/plain,text/markdown,text/csv,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
  </section>

  <p class="file-name" id="fileName" hidden></p>

  <div class="actions">
    <button type="button" class="btn-primary" id="run" disabled>开始翻译</button>
    <span id="status" role="status"></span>
  </div>

  <div class="progress" id="progress" hidden>
    <div class="bar-fill" id="progressFill"></div>
  </div>

  <section class="preview" id="preview" hidden>
    <h2>对照预览</h2>
    <div id="previewBody"></div>
  </section>
</main>

<script src="doc.js" type="module"></script>
</body>
</html>
