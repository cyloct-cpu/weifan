<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>微翻 · 设置</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 20px 64px;
      background: #0b141a;
      color: #e9edef;
      font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #8696a0; font-size: 12.5px; margin-bottom: 28px; }
    section {
      background: #111b21;
      border: 1px solid #22303a;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }
    h2 { font-size: 14px; margin: 0 0 14px; color: #d1d7db; font-weight: 600; }
    label { display: block; font-size: 12.5px; color: #8696a0; margin: 12px 0 4px; }
    label:first-of-type { margin-top: 0; }
    input[type="text"], input[type="password"], input[type="number"], select, textarea {
      width: 100%;
      background: #0b141a;
      border: 1px solid #2a3942;
      border-radius: 8px;
      color: #e9edef;
      padding: 9px 11px;
      font: inherit;
      font-size: 13px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: #00a884; }
    textarea { min-height: 88px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .check { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 13px; color: #d1d7db; }
    .check input { width: 16px; height: 16px; accent-color: #00a884; }
    .hint { font-size: 12px; color: #667781; margin-top: 6px; }
    .warn { font-size: 12px; color: #f1a45c; margin-top: 8px; }
    .actions { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    button {
      background: #00a884;
      color: #06231d;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button.ghost { background: rgba(233,237,239,.1); color: #e9edef; font-weight: 400; }
    #status { font-size: 12.5px; color: #00a884; }
    code { background: #0b141a; border: 1px solid #2a3942; border-radius: 4px; padding: 1px 5px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>微翻 · 设置</h1>
    <div class="sub">密钥只保存在本机浏览器里（chrome.storage.local），不经过任何服务器。填完刷新 WhatsApp 页面即可生效。</div>

    <section>
      <h2>翻译服务（至少填一个）</h2>

      <label>大模型 · Groq（推荐，低延迟）</label>
      <input type="password" id="groq" placeholder="gsk_..." autocomplete="off" />
      <div class="hint">长句、含金额/数字的消息走这里。到 console.groq.com 申请。</div>

      <label>机翻 · DeepL（中→欧语质量最稳）</label>
      <input type="password" id="deepl" placeholder="xxxxxxxx-xxxx-...:fx" autocomplete="off" />
      <label>DeepL 端点</label>
      <input type="text" id="deeplEndpoint" placeholder="https://api-free.deepl.com/v2/translate" />

      <label>机翻 · Google Cloud Translation（DeepL 不支持的语种靠它兜底）</label>
      <input type="password" id="google" placeholder="AIza..." autocomplete="off" />

      <label>备用大模型（OpenAI 兼容：DeepSeek / 自建）</label>
      <div class="row">
        <div>
          <input type="password" id="llm" placeholder="sk-..." autocomplete="off" />
        </div>
        <div>
          <input type="text" id="llmBaseURL" placeholder="https://api.deepseek.com/v1" />
        </div>
      </div>
      <input type="text" id="llmModel" placeholder="deepseek-chat" style="margin-top:8px" />

      <div class="warn">签名密钥以明文保存在本机浏览器配置中。共用电脑时请注意。</div>
    </section>

    <section>
      <h2>行为</h2>

      <label>兜底目标语言（检测不出对方语言时用）</label>
      <select id="defaultTarget"></select>

      <label>默认语气</label>
      <select id="style">
        <option value="business">商务：正式、简洁、不用缩略语</option>
        <option value="casual">日常：口语、简短</option>
        <option value="literal">直译：单据、合同条款</option>
      </select>

      <div class="check">
        <input type="checkbox" id="autoIncoming" />
        <label for="autoIncoming" style="margin:0">自动翻译对方消息（滚动到哪译到哪）</label>
      </div>
      <div class="check">
        <input type="checkbox" id="allowDirectSend" />
        <label for="allowDirectSend" style="margin:0">点「译」直接替换输入框（含金额时仍会先确认）</label>
      </div>
      <div class="check">
        <input type="checkbox" id="previewOnLowConfidence" />
        <label for="previewOnLowConfidence" style="margin:0">语言判断不确定时先确认再替换</label>
      </div>

      <label>长句阈值（超过就走大模型）：<span id="thresholdLabel">60</span> 字</label>
      <input type="range" id="longSentenceThreshold" min="20" max="200" step="10" style="width:100%" />
    </section>

    <section>
      <h2>术语：不要乱译的词</h2>
      <div class="hint" style="margin-bottom:8px">
        一行一条。默认原样保留；需要固定译法时写成 <code>原文 =&gt; 语言: 译文</code>，例如<br />
        <code>轻舟 Pro</code><br />
        <code>定金 =&gt; es: depósito</code>
      </div>
      <textarea id="glossary" placeholder="轻舟 Pro&#10;Chan&#10;定金 => es: depósito"></textarea>
    </section>

    <div class="actions">
      <button id="save">保存</button>
      <button id="clearCache" class="ghost">清空翻译缓存</button>
      <span id="status"></span>
    </div>
  </div>

  <script src="options.js" type="module"></script>
</body>
</html>
