<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>微翻 · 文本翻译</title>
  <link rel="icon" href="../icons/favicon-32.png" type="image/png" />
  <!-- 首屏同步上色：模块脚本是延迟执行的，等它跑到页面已经画过一次了，会闪白 -->
  <script>
    try {
      var t = localStorage.getItem('weifan.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="text.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <strong class="wordmark">微翻 · 文本翻译</strong>
    <span class="hint-left">密钥只留在本机</span>
    <button type="button" class="theme-btn" id="themeBtn" title="昼夜切换" aria-label="昼夜切换">
      <span class="theme-icon"></span>
    </button>
  </div>
</header>

<main class="page">
  <!-- 原文：只有它能输入 -->
  <section class="pane solo">
    <div class="pane-head">
      <span>原文</span>
      <button type="button" class="mini" id="paste">粘贴</button>
    </div>
    <textarea id="input" placeholder="把要翻译的文本粘进来，或点「粘贴」从剪贴板读取"></textarea>
  </section>

  <div class="actions">
    <button type="button" class="btn-primary" id="run">翻译</button>
    <span id="status" role="status"></span>
  </div>

  <!-- 语言行放在中间：源 ⇄ 目标 ⇄ 第二个目标，三个都能直接打字 -->
  <section class="bar langbar">
    <div class="langrow">
      <input class="langinput" id="srcLang" list="langlist" placeholder="源语言" autocomplete="off" spellcheck="false" />
      <button type="button" class="swap" id="swap1" title="互换源语言与目标语言（原文译文一起换）">⇄</button>
      <input class="langinput" id="dstLang" list="langlist" placeholder="目标语言" autocomplete="off" spellcheck="false" />
      <button type="button" class="swap" id="swap2" title="互换两个目标语言">⇄</button>
      <input class="langinput" id="dstLang2" list="langlist" placeholder="第二个目标（选填）" autocomplete="off" spellcheck="false" />
    </div>
    <datalist id="langlist"></datalist>

    <div class="barrow">
      <div class="group">
        <label class="lbl" for="service">服务</label>
        <select id="service"></select>
      </div>
      <div class="group">
        <label class="lbl" for="style">语气</label>
        <select id="style">
          <option value="business">商务</option>
          <option value="casual">日常</option>
          <option value="literal">直译</option>
        </select>
      </div>
    </div>
  </section>

  <!-- 译文：每个都自带复制与朗读按钮 -->
  <section class="pane">
    <div class="pane-head">
      <span>译文</span>
      <span class="pane-head-btns">
        <button type="button" class="mini" id="speak">朗读</button>
        <button type="button" class="mini" id="copy">复制</button>
      </span>
    </div>
    <textarea id="output" readonly placeholder="译文会出现在这里"></textarea>
  </section>

  <section class="pane">
    <div class="pane-head">
      <span>译文（第二个目标语言）</span>
      <span class="pane-head-btns">
        <button type="button" class="mini" id="speak2">朗读</button>
        <button type="button" class="mini" id="copy2">复制</button>
      </span>
    </div>
    <textarea id="output2" readonly placeholder="填了第二个目标语言，这里会同时给出另一份译文"></textarea>
  </section>
</main>

<script src="text.js" type="module"></script>
</body>
</html>
