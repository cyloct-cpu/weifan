<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>微翻 · 文本翻译</title>
  <link rel="icon" href="../icons/favicon-32.png" type="image/png" />
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="text.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <strong class="wordmark">微翻 · 文本翻译</strong>
    <span class="hint-left">密钥只留在本机</span>
  </div>
</header>

<main class="page">
  <section class="bar">
    <div class="group">
      <label class="lbl" for="sourceLang">源语言</label>
      <select id="sourceLang"></select>
    </div>
    <div class="group">
      <label class="lbl" for="targetLang">目标语言</label>
      <select id="targetLang"></select>
    </div>
    <div class="group">
      <label class="lbl" for="service">服务</label>
      <select id="service"></select>
    </div>
    <div class="group">
      <label class="lbl" for="style">语气</label>
      <select id="style">
        <option value="business">商务</option>
        <option value="casual">日常</option>
        <option value="literal">直译</option>
      </select>
    </div>
  </section>

  <section class="panes">
    <div class="pane">
      <div class="pane-head">
        <span>原文</span>
        <button type="button" class="mini" id="paste">粘贴</button>
      </div>
      <textarea id="input" placeholder="把要翻译的文本粘进来，或点「粘贴」从剪贴板读取"></textarea>
    </div>
    <div class="pane">
      <div class="pane-head">
        <span>译文</span>
        <button type="button" class="mini" id="copy">复制</button>
      </div>
      <textarea id="output" readonly placeholder="译文会出现在这里"></textarea>
    </div>
  </section>

  <div class="actions">
    <button type="button" class="btn-primary" id="run">翻译</button>
    <button type="button" class="btn-ghost" id="swap">对调</button>
    <span id="status" role="status"></span>
  </div>
</main>

<script src="text.js" type="module"></script>
</body>
</html>
