name: WeiFan
options:
  bundleIdPrefix: com.weifan
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  WeiFanCore:
    path: ../core

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # 改成你自己的 Apple Developer Team ID，否则无法签名
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  WeiFan:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/App
      - path: Sources/Shared
    dependencies:
      - package: WeiFanCore
      - target: WeiFanKeyboard
        embed: true
      - target: WeiFanShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weifan.app
        PRODUCT_NAME: 微翻
        INFOPLIST_FILE: Resources/Info-App.plist
        CODE_SIGN_ENTITLEMENTS: Resources/WeiFan.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  WeiFanKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/Keyboard
      - path: Sources/Shared
    dependencies:
      - package: WeiFanCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weifan.app.keyboard
        PRODUCT_NAME: WeiFanKeyboard
        INFOPLIST_FILE: Resources/Info-Keyboard.plist
        CODE_SIGN_ENTITLEMENTS: Resources/WeiFanKeyboard.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  WeiFanShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/Share
      - path: Sources/Shared
    dependencies:
      - package: WeiFanCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weifan.app.share
        PRODUCT_NAME: WeiFanShare
        INFOPLIST_FILE: Resources/Info-Share.plist
        CODE_SIGN_ENTITLEMENTS: Resources/WeiFanShare.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
