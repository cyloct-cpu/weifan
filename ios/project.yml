name: WeiFan
options:
  bundleIdPrefix: com.weifan
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  WeiFanCore:
    path: ../core
    from: "7.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # 改成你自己的 Apple Developer Team ID，否则无法签名
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  WeiFan:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Assets.xcassets
    dependencies:
      - package: WeiFanCore
      - framework: Frameworks/WeifanProtocol.xcframework
        embed: true
      - target: WeiFanKeyboard
        embed: true
      - target: WeiFanShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weifan.app
        PRODUCT_NAME: 微翻
        SWIFT_OBJC_BRIDGING_HEADER: Sources/App/ProtocolBridging.h
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks/ProtocolHeaders"
        OTHER_LDFLAGS: "$(inherited) -framework WeifanProtocol"
        INFOPLIST_FILE: Resources/Info-App.plist
        CODE_SIGN_ENTITLEMENTS: Resources/WeiFan.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "3.9.1"
        CURRENT_PROJECT_VERSION: "55"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  WeiFanKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/Keyboard
      - path: Sources/Shared
    dependencies:
      - package: WeiFanCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weifan.app.keyboard
        PRODUCT_NAME: WeiFanKeyboard
        INFOPLIST_FILE: Resources/Info-Keyboard.plist
        CODE_SIGN_ENTITLEMENTS: Resources/WeiFanKeyboard.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "3.9.1"
        CURRENT_PROJECT_VERSION: "55"

  WeiFanShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/Share
      - path: Sources/Shared
    dependencies:
      - package: WeiFanCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weifan.app.share
        PRODUCT_NAME: WeiFanShare
        INFOPLIST_FILE: Resources/Info-Share.plist
        CODE_SIGN_ENTITLEMENTS: Resources/WeiFanShare.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "3.9.1"
        CURRENT_PROJECT_VERSION: "55"

  # UI 测试：本机没有 Simulator.app（精简版 Xcode），鼠标点不了，
  # 用 XCUITest 驱动导航与断言，headless 也能跑，同时留下可复跑的资产。
  WeiFanUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/UITests
    dependencies:
      - target: WeiFan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weifan.app.uitests
        SWIFT_OBJC_BRIDGING_HEADER: Sources/App/ProtocolBridging.h
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks/ProtocolHeaders"
        OTHER_LDFLAGS: "$(inherited) -framework WeifanProtocol"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks/WeifanProtocol.xcframework/ios-arm64_x86_64-simulator"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WeiFan
